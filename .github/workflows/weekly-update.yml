name: Weekly Tierlist Data Update

on:
  schedule:
    # 매주 월요일 00:00 UTC (한국시간 09:00)
    - cron: '3 0 * * 1'
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests cloudscraper beautifulsoup4 Pillow

      - name: Run build with check
        run: python tools/build_data.py --check

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && git diff --cached --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT
          # 신규 파일도 체크
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/characters.json data/name_ko.csv images/icons/ images/ls/ images/banner.png images/banner_meta.json
          git diff --cached --quiet || git commit -m "data: 티어리스트 자동 동기화 $(date -u +%Y-%m-%d)"
          git push
