/* ═══════════════════════════════════════════
   DRAG & DROP — Pointer Events (touch + mouse)
   ═══════════════════════════════════════════ */
let _drag = null; // { charId, ghost, origCard, startX, startY, moved }

/* ─── Tap-Select State ─── */
function dragStart(charId, card, e) {
  e.preventDefault();
  const rect = card.getBoundingClientRect();
  const ghost = card.cloneNode(true);
  ghost.className = 'char-card drag-ghost';
  ghost.style.width = rect.width + 'px';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  document.body.appendChild(ghost);
  card.style.opacity = '0.3';

  _drag = { charId, ghost, origCard: card, startX: e.clientX, startY: e.clientY, moved: false };

  document.addEventListener('pointermove', dragMove);
  document.addEventListener('pointerup', dragEnd);
  document.addEventListener('pointercancel', dragEnd);
}

function dragMove(e) {
  if (!_drag) return;
  const dx = e.clientX - _drag.startX;
  const dy = e.clientY - _drag.startY;
  if (!_drag.moved && Math.abs(dx) < 8 && Math.abs(dy) < 8) return; // dead zone for tap
  _drag.moved = true;
  if (_drag.origCard) _drag.origCard.style.touchAction = 'none'; // lock scroll during drag
  _drag.ghost.style.left = (e.clientX - 30) + 'px';
  _drag.ghost.style.top = (e.clientY - 30) + 'px';

  // Highlight drop zone under cursor
  _drag.ghost.style.display = 'none';
  const el = document.elementFromPoint(e.clientX, e.clientY);
  _drag.ghost.style.display = '';

  document.querySelectorAll('.drag-over').forEach(d => d.classList.remove('drag-over'));
  // tier-label도 같은 행의 tier-drop으로 처리
  let dropZone = el ? el.closest('.tier-drop, .pool-grid') : null;
  if (!dropZone && el) {
    const label = el.closest('.tier-label');
    if (label) dropZone = label.parentElement.querySelector('.tier-drop');
  }
  if (dropZone) dropZone.classList.add('drag-over');
}

function dragEnd(e) {
  if (!_drag) return;
  document.removeEventListener('pointermove', dragMove);
  document.removeEventListener('pointerup', dragEnd);
  document.removeEventListener('pointercancel', dragEnd);
  document.querySelectorAll('.drag-over').forEach(d => d.classList.remove('drag-over'));

  if (_drag.origCard) { _drag.origCard.style.opacity = '1'; _drag.origCard.style.touchAction = 'pan-y'; }
  _drag.ghost.remove();

  if (!_drag.moved) {
    // Tap without drag — show move menu for quick placement
    const c = DB.characters.find(ch => ch.id === _drag.charId);
    _drag = null;
    if (c) showMoveMenu(c, e);
    return;
  }

  // Find drop target
  const el = document.elementFromPoint(e.clientX, e.clientY);

  const catId = S.workspace.activeCategory;
  if (!catId) { _drag = null; return; }

  // tier-label도 같은 행의 tier-drop으로 처리
  let dropZone = el ? el.closest('.tier-drop, .pool-grid') : null;
  if (!dropZone && el) {
    const label = el.closest('.tier-label');
    if (label) dropZone = label.parentElement.querySelector('.tier-drop');
  }
  if (dropZone) {
    removePlacement(catId, _drag.charId);
    if (dropZone.classList.contains('tier-drop')) {
      const tierId = dropZone.dataset.tier;
      const insertIdx = getInsertIndex(dropZone, e.clientX);
      addPlacement(catId, tierId, _drag.charId, insertIdx);
    }
    // pool-grid drop = unrank (already removed)
    autoSave();
    renderAll();
  }

  _drag = null;
}

function removePlacement(catId, charId) {
  const cp = S.workspace.placements[catId];
  if (!cp) return;
  for (const tid of Object.keys(cp)) {
    const idx = cp[tid].indexOf(charId);
    if (idx >= 0) { cp[tid].splice(idx, 1); return; }
  }
}

function addPlacement(catId, tierId, charId, insertIdx) {
  if (!S.workspace.placements[catId]) S.workspace.placements[catId] = {};
  if (!S.workspace.placements[catId][tierId]) S.workspace.placements[catId][tierId] = [];
  const arr = S.workspace.placements[catId][tierId];
  if (insertIdx !== undefined && insertIdx >= 0 && insertIdx < arr.length) {
    arr.splice(insertIdx, 0, charId);
  } else {
    arr.push(charId);
  }
}

// 드롭 위치에서 삽입 인덱스 계산
function getInsertIndex(dropZone, clientX) {
  const cards = dropZone.querySelectorAll('.char-card');
  if (!cards.length) return 0;
  for (let i = 0; i < cards.length; i++) {
    const rect = cards[i].getBoundingClientRect();
    const midX = rect.left + rect.width / 2;
    if (clientX < midX) return i;
  }
  return cards.length; // after last card
}

/* ═══════════════════════════════════════════
   IMAGE EXPORT (html2canvas)
   ═══════════════════════════════════════════ */
async function captureArea() {
  if (typeof html2canvas === 'undefined') {
    alert(T('html2canvasWait'));
    return null;
  }
  // Builder 모드일 때 Viewer 전환 안내
  if (S.mode === 'builder') {
    if (confirm(T('captureWarning'))) {
      setMode('viewer');
      await new Promise(r => setTimeout(r, 100)); // re-render 대기
    }
  }
  const area = document.getElementById('capture-area');

  // Show capture banner/footer
  const banner = document.getElementById('capture-banner');
  const footer = document.getElementById('capture-footer');
  if (banner) {
    const capTitle = document.getElementById('cap-title');
    const capCat = document.getElementById('cap-category');
    const capVer = document.getElementById('cap-version');
    capTitle.textContent = T('title').replace(' 빌더', '').replace(' Builder', '');
    const activeCat = S.workspace.categories.find(c => c.id === S.workspace.activeCategory);
    capCat.textContent = (activeCat ? activeCat.name + ' · ' : '') + new Date().toISOString().slice(0,10);
    capVer.textContent = gameVersion ? T('gameVerPrefix') + gameVersion : '';
    banner.style.display = 'flex';
  }
  if (footer) footer.style.display = 'flex';

  const canvas = await html2canvas(area, {
    backgroundColor: '#0d1117',
    scale: Math.max(window.devicePixelRatio || 2, 3),
    useCORS: true,
    logging: false
  });

  // Hide banner/footer
  if (banner) banner.style.display = 'none';
  if (footer) footer.style.display = 'none';
  return canvas;
}

async function copyAsImage() {
  const canvas = await captureArea();
  if (!canvas) return;
  try {
    canvas.toBlob(async blob => {
      await navigator.clipboard.write([
        new ClipboardItem({ 'image/png': blob })
      ]);
      alert(T('imageCopied')(Math.round(blob.size/1024)));
    }, 'image/png');
  } catch(e) {
    console.error('Clipboard write failed', e);
    // Fallback: download
    saveCanvasAsPNG(canvas);
  }
}

async function saveAsImage() {
  const canvas = await captureArea();
  if (!canvas) return;
  saveCanvasAsPNG(canvas);
}

function saveCanvasAsPNG(canvas) {
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/jpeg', 0.95);
  a.download = 'ae-tierlist-' + new Date().toISOString().slice(0,10) + '.jpg';
  a.click();
}

/* ═══════════════════════════════════════════
   INTRO SCREEN
   ═══════════════════════════════════════════ */
const WIKI_UPDATE_IMG = 'https://anothereden.wiki/w/Special:FilePath/';
const WIKI_MAIN_URL = 'https://anothereden.wiki';
let gameVersion = '';

async function loadIntroBanner() {
  const banner = document.getElementById('intro-banner');
  const verEl = document.getElementById('intro-ver');
  const gvEl = document.getElementById('game-version');

  // 로드 성공 시 표시, 실패 시 숨김 유지
  banner.onload = () => { banner.style.display = ''; };
  banner.onerror = () => { banner.style.display = 'none'; };

  // 1) 로컬 배너 메타 시도 (update_tierlist_banner.py로 다운로드)
  try {
    const metaResp = await fetch('images/banner_meta.json');
    if (metaResp.ok) {
      const meta = await metaResp.json();
      banner.src = 'images/banner.png';
      gameVersion = meta.version || '';
    } else {
      throw new Error('no meta');
    }
  } catch(e) {
    // 2) 로컬 없으면 위키 직접 시도 (CORS 허용 시에만)
    banner.src = 'https://anothereden.wiki/images/e/e3/An_Ode_to_Origin_Act_4_3.14.50.png';
    gameVersion = '3.14.50';
  }

  const ver = DB.meta.version || '';
  verEl.textContent = T('gameVerPrefix') + (gameVersion || '?') + (ver ? ' | DB: ' + ver : '');
  if (gvEl) gvEl.textContent = gameVersion || '-';
}

function dismissIntro() {
  const intro = document.getElementById('intro-screen');
  intro.classList.add('hidden');
  setTimeout(() => intro.style.display = 'none', 500);
  sessionStorage.setItem('ae_intro_dismissed', '1');
}

function showIntro() {
  const intro = document.getElementById('intro-screen');
  intro.style.display = 'flex';
  intro.classList.remove('hidden');
  sessionStorage.removeItem('ae_intro_dismissed');
}

/* ═══════════════════════════════════════════
   CUSTOM CHARACTER
   ═══════════════════════════════════════════ */
const CUSTOM_CHARS_KEY = 'ae_tierlist_custom_chars';
let customCharImage = null; // base64 data URL

function showAddCharModal() {
  document.getElementById('add-char-modal').style.display = 'flex';
  // Reset form
  ['acm-name','acm-name-en'].forEach(id => document.getElementById(id).value = '');
  ['acm-element','acm-weapon'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('acm-style').value = 'NS';
  document.getElementById('acm-rarity').value = '5';
  document.getElementById('acm-ls').value = '';
  document.getElementById('acm-sa').checked = false;
  customCharImage = null;
  const drop = document.getElementById('acm-img-drop');
  drop.innerHTML = `<span id="acm-img-placeholder">${T('dropPaste')}</span>`;
  setupImageDrop();
}

function closeAddChar() {
  document.getElementById('add-char-modal').style.display = 'none';
}

function setupImageDrop() {
  const drop = document.getElementById('acm-img-drop');

  // Drag & drop
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag-over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
  drop.addEventListener('drop', e => {
    e.preventDefault(); drop.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) readImageFile(file);
  });

  // Click to trigger file input
  drop.addEventListener('click', () => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => { if (inp.files[0]) readImageFile(inp.files[0]); };
    inp.click();
  });

  // Paste
  document.addEventListener('paste', e => {
    if (document.getElementById('add-char-modal').style.display === 'none') return;
    const items = e.clipboardData.items;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        readImageFile(item.getAsFile());
        break;
      }
    }
  });
}

function readImageFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    customCharImage = e.target.result;
    const drop = document.getElementById('acm-img-drop');
    drop.innerHTML = `<img src="${customCharImage}" alt="preview">`;
  };
  reader.readAsDataURL(file);
}

function saveCustomChar() {
  const name = document.getElementById('acm-name').value.trim();
  if (!name) { alert(T('nameRequired')); return; }

  const nameEn = document.getElementById('acm-name-en').value.trim() || name;
  const element = document.getElementById('acm-element').value;
  const weapon = document.getElementById('acm-weapon').value;
  const style = document.getElementById('acm-style').value;
  const rarity = parseInt(document.getElementById('acm-rarity').value);
  const ls = document.getElementById('acm-ls').value;
  const sa = document.getElementById('acm-sa').checked;

  const id = 'custom_' + Date.now();
  const char = {
    id, nameKo: name, nameEn, style, rarity, sa,
    element: element || 'null',
    elementKo: ELEMENT_KO[element] || '무',
    weapon: weapon || '',
    weaponKo: WEAPON_KO[weapon] || '',
    attackType: ATK_TYPE[weapon] || '',
    ls, acq: 'custom', date: new Date().toISOString().slice(0,10),
    icon: '', customImg: customCharImage || ''
  };

  // Add to DB
  DB.characters.push(char);
  DB_MAP[id] = char;

  // Save custom chars to localStorage
  const customs = loadCustomChars();
  customs.push(char);
  localStorage.setItem(CUSTOM_CHARS_KEY, JSON.stringify(customs));

  closeAddChar();
  renderAll();
}

function loadCustomChars() {
  try {
    const raw = localStorage.getItem(CUSTOM_CHARS_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}

function restoreCustomChars() {
  const customs = loadCustomChars();
  customs.forEach(c => {
    if (!DB_MAP[c.id]) {
      DB.characters.push(c);
      DB_MAP[c.id] = c;
    }
  });
  if (customs.length) console.log(`Restored ${customs.length} custom characters`);
}
